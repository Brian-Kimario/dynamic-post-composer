spring.application.name=post-composer-api
server.port=8080

spring.datasource.url=jdbc:h2:mem:postcomposer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# The H2 console would be an unauthenticated back door to the user table; enable only for local debugging.
spring.h2.console.enabled=false

# Error bodies are produced by GlobalExceptionHandler; never leak Spring's defaults.
server.error.include-message=never
server.error.include-stacktrace=never

# Origins allowed to call /api/** (comma separated). Vite dev + preview servers by default.
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000

logging.level.com.brian.postcomposer=INFO

# Pagination (2.2.1): zero-based pages, 20 per page unless a controller says otherwise, hard cap of 100.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Caching (2.2.2): Ehcache 3 via JCache. Use spring.cache.type=none to turn it off.
spring.cache.jcache.config=classpath:ehcache.xml

# JDBC batching, so bulk inserts (the seed loader) are not one round trip per row.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# Optional demo data for benchmarking: app.seed.enabled=true app.seed.posts=5000
app.seed.enabled=false
app.seed.posts=5000
app.seed.authors=50

# --- Security (Experiment 2.3) ---
# HS256 key, Base64, >= 32 bytes: set JWT_SECRET. If unset, a random key is generated at startup (tokens die on restart).
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=post-composer-api
app.security.jwt.access-ttl=PT15M
app.security.jwt.refresh-ttl=P7D
# Set true behind HTTPS (required in production so the refresh cookie is never sent over plain HTTP).
app.security.cookie-secure=false
# AES-256 key, Base64 of exactly 32 bytes: set ENCRYPTION_KEY. If unset, a random key is generated at startup
# (fine for the in-memory dev database; stored credentials would be unreadable after a restart otherwise).
app.security.encryption-key=${ENCRYPTION_KEY:}
# Demo accounts matching the UI's login screen (ava=ADMIN, noah=EDITOR, priya=VIEWER). Turn off outside demos.
app.security.seed-demo-users=true
# Set DEMO_PASSWORD to choose it; if unset a random one is generated and logged once at startup.
app.security.demo-password=${DEMO_PASSWORD:}

# --- Kafka reliability (Experiment 3.1.1) ---
# Off by default so the API runs without a broker. Start one with `docker compose up -d` and set KAFKA_ENABLED=true.
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topic=post.scheduled
app.kafka.dlt-topic=post.scheduled.DLT
# Blocking retries with exponential backoff: wait 1s, 2s, 4s (capped at 10s) between the 3 retries, then dead-letter.
app.kafka.retry.max-retries=3
app.kafka.retry.initial-interval-ms=1000
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-interval-ms=10000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Producer reliability: idempotent producer (no broker-side duplicates on retry) and acks from all in-sync replicas.
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Consumer: a poison pill is surfaced to the error handler (and the DLT) instead of looping forever.
spring.kafka.consumer.group-id=post-composer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.brian.postcomposer.kafka.PostScheduledEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.brian.postcomposer.kafka
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=false
