# Canary gateway: ~10% of requests go to the new version, the rest to stable.
upstream api {
    server stable:8080 weight=9;
    server canary:8080 weight=1;
}
server {
    listen 80;
    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        add_header X-Served-By $upstream_addr always;
    }
}
