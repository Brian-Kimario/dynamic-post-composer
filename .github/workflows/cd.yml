name: CD

# Runs only after the CI workflow succeeds on main (Continuous Deployment).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry with the built-in GITHUB_TOKEN, no stored secrets

jobs:
  build-and-push:
    name: Build and push Docker image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/post-composer-api:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          tags: ${{ steps.meta.outputs.image }}

  canary:
    name: Canary release (10% then promote)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start stable + canary behind the 90/10 gateway
        working-directory: backend/deploy
        env:
          STABLE_IMAGE: ${{ needs.build-and-push.outputs.image }}
          CANARY_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          docker compose -f docker-compose.canary.yml up -d --wait --wait-timeout 180
      - name: Monitor canary traffic (gate)
        run: backend/deploy/canary-check.sh http://localhost:8081 100
      - name: Promote canary to 100%
        run: echo "Canary healthy - promoting ${{ needs.build-and-push.outputs.image }} to all users"
      - name: Roll back on failure
        if: failure()
        run: echo "Canary failed - traffic stays on the stable version"
      - name: Gateway logs
        if: always()
        working-directory: backend/deploy
        run: docker compose -f docker-compose.canary.yml logs --no-color | tail -50
